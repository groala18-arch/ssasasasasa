                            flyCard.style.border = '2px solid #dcb360';
                            setTimeout(() => {
                                dealerSearchCardsArray.forEach(c => {
                                    c.style.transform = `translate(-50%, -50%) scale(0) rotate(-360deg)`;
                                    c.style.opacity = '0';
                                });
                                setTimeout(() => {
                                    dealerSearchCardsArray.forEach(c => c.remove());
                                    dealerSearchCardsArray = [];
                                }, 400);
                            }, 1000);

                }
            }, delay);

    async function playRevealLoop(data) {
        let activePlayers = data.reveal_data.players || [];

        for (let p of activePlayers) {
            let slot = document.querySelector(`.slot-${p.seat}`);
            if (slot) {
                slot.classList.add('is-reveal-slot');
                slot.classList.add('reveal-focus');
                playSound('fold');
                await new Promise(r => setTimeout(r, 1000));
                slot.classList.remove('reveal-focus');
            }
        }
        socket.emit('get_state');
    }

    function buildCardHtml(cardStr, isFaceDown, isHero = false, isReveal = false, isDealingPhase = false, score = 0, heroIdx = -1, gameState = "") {
        let hiddenClass = isDealingPhase ? ' card-hidden' : '';
        if (cardStr === "BACK") {
            isFaceDown = true;
            cardStr = "♥️A"; // Фейковая строка для сохранения DOM структуры, чтобы карта не "сдувалась"
        }

        let isRed = cardStr && (cardStr.includes('♥️') || cardStr.includes('♦️'));
        let isJoker = cardStr && cardStr.includes('🃏');
        let colorClass = "";
        if (isRed) colorClass = " card-red";
        if (isJoker) colorClass = " card-joker";

        let epicClass = "";
        if (isReveal && !isFaceDown) {
            if (score >= 33.0) epicClass = " card-epic";
            else if (score >= 31.0) epicClass = " card-legendary";
        }

        let rank = "";
        let suit = "";
        if (cardStr) {
            if (isJoker) {
                rank = "★";
                suit = "🃏";
            } else {
                rank = cardStr.replace(/♥️|♦️|♣️|♠️/g, '');
                suit = cardStr.replace(/[0-9A-Za-z]/g, '');
            }
        }

        let cardInner = `<div class="card-corner"><span class="rank">${rank}</span><span class="suit">${suit}</span></div><div class="card-center-bg">${suit}</div>`;

        if (isHero) {
            let openClass = (isReveal || (heroIdx >= 0 && window.heroOpenedCards[heroIdx])) ? ' force-open' : '';
            return `<div class="hero-card-container${openClass}${hiddenClass}${epicClass}"><div class="hero-card-flipper"><div class="hero-card-face hero-card-back"></div><div class="hero-card-face hero-card-value${colorClass}">${cardInner}</div></div></div>`;
        } else {
            return `<div class="poker-card${colorClass}${hiddenClass}${epicClass}${isFaceDown ? ' face-down' : ''}">${cardInner}</div>`;
        }
    }

    function renderPlayers(data, isDealingPhase = false, forceFaceDown = false) {
        let potBadge = document.getElementById('center-pot-total-badge');
        let betBadge = document.getElementById('center-pot-bet-badge');
        if (data.pot > 0) {
            potBadge.style.display = 'block';
            potBadge.innerText = `${data.pot}`;
        } else {
            potBadge.style.display = 'none';
        }
        if (data.current_bet > 0) {
            betBadge.style.display = 'block';
            betBadge.innerText = `СТАВКА: ${data.current_bet}`;
        } else {
            betBadge.style.display = 'none';
        }

        updateDeckCountSmooth(data.deck_count || 0);
        let suitName = SUITS_RU[data.excluded_suit] || "...";
        document.getElementById('deck-modal-suit-info').innerText = `ИСКЛЮЧЕНА МАСТЬ: ${suitName}`;

        const me = data.players.find(p => p.tg_id === userId);
        if (me) {
            mySid = me.sid;
            if (me.incoming_zakruzhit && document.getElementById('zakruzhit-modal-overlay').style.display !== 'flex') {
                showIncomingZakruzhitModal(me.incoming_zakruzhit);
            } else if (!me.incoming_zakruzhit) {
                document.getElementById('zakruzhit-modal-overlay').style.display = 'none';
            }
            if (me.cards && me.cards.length > 0) {
                let currentHandKey = me.cards.join(',');
                if (window.lastHandKey !== currentHandKey) {
                    window.heroOpenedCards = [false, false, false];
                    window.lastHandKey = currentHandKey;
                }
                window.currentHeroCards = me.cards;
            }
        }

        let slots = Array(9).fill(null);
        data.players.forEach((p, idx) => {
            let assignedSeat = (p.seat !== undefined) ? p.seat : ((p.slot !== undefined) ? p.slot : idx);
            if (assignedSeat >= 0 && assignedSeat < 9) slots[assignedSeat] = p;
        });

        const wrapper = document.getElementById('table-slots-wrapper');
        wrapper.innerHTML = '';
        let isRevealPhase = (data.state === "REVEAL" || (data.state === "PRE_ROUND_WAIT" && data.reveal_data && data.reveal_data.winners));
        if (forceFaceDown) isRevealPhase = false;

        let winners = [];
        if (data.reveal_data && data.reveal_data.players) {
            winners = data.reveal_data.players.filter(p => p.is_winner).map(p => p.sid);
        }

        slots.forEach((p, index) => {
            let slotClass = `seat-slot slot-${index}`;
            if (p) {
                let isTurn = false;
                if (p.sid === data.current_turn_sid && data.turn_deadline > 0) isTurn = true;
                if (data.state === "PAYING_ANTE" && p.status === 'Ожидание анте' && !p.folded) isTurn = true;
                if (data.state === "SVARA_CHECK_IN" && p.status === 'Решает по Сваре' && !p.folded) isTurn = true;
                if (data.state === "WAITING_SVARA_ACCEPT" && p.sid !== data.svara_proposer_sid && !p.folded) isTurn = true;
                if (data.state === "MUCK_OR_SHOW" && p.sid === data.current_turn_sid) isTurn = true;
                if (isTurn) slotClass += ' active-turn';

                if (isRevealPhase && !p.folded) {
                    slotClass += ' is-reveal-slot';
                    if (winners.includes(p.sid)) slotClass += ' is-winner'; else slotClass += ' is-loser';
                }
            }

            if (!p) {
                wrapper.innerHTML += `<div class="${slotClass}"><div class="empty-seat-btn" onclick="joinGame(${index})">+</div></div>`;
            } else {
                let isDealer = (p.sid === data.dealer_sid);
                let dealerBadge = isDealer ? `<div class="dealer-button">D</div>` : '';
                let darkBadge = p.is_dark_bettor ? `<div class="dark-icon">ТЕМНИТ</div>` : '';
                let partnerIcon = p.zakruzhit_partner ? `<div class="zakruzhit-icon">🤝</div>` : ''; // Индикатор союза

                let cardsContainerHtml = '';
                let isHero = (p.tg_id === userId);
                let showAvatarCards = false;
                if (isRevealPhase && !p.folded) showAvatarCards = true; else if (!isHero && p.cards && p.cards.length > 0 && !p.folded) showAvatarCards = true;

                if (showAvatarCards) {
                    cardsContainerHtml = `<div class="player-cards-container"><div class="poker-hand-row">`;
                    let isHandFaceDown = (!isRevealPhase && !isHero) || forceFaceDown;
                    p.cards.slice(0, 3).forEach(card => {
                        cardsContainerHtml += buildCardHtml(card, isHandFaceDown, false, isRevealPhase, isDealingPhase, p.score_num);
                    });
                    cardsContainerHtml += `</div></div>`;
                }

                let displayStatus = p.status.toUpperCase();
                if (p.status === 'В лобби') {
                    displayStatus = '<span style="color:#887a70;">В ЛОББИ</span>';
                } else if (p.status === 'Готов' || p.status === 'Ожидание' || p.status === 'Ожидает (Свара)') {
                    displayStatus = `<span style="color:#a39589;">ОЖИДАЕТ КОНА</span>`;
                } else if (p.folded) {
                    displayStatus = '<span style="color:var(--blood-red);">ПАС</span>';
                } else if (p.all_in) {
                    displayStatus = '<span style="color:var(--gold-border); font-weight:900;">ALL-IN</span>';
                } else if (p.sid === data.current_turn_sid && data.turn_deadline > 0) {
                    displayStatus = '<span style="color:#bcaaa4;">ДУМАЕТ...</span>';
                } else {
                    if (data.state === "MAIN_BETTING" && p.acted) {
                        if (p.round_bet > 0) displayStatus = `<span style="color:var(--gold-border);">ДАЛ ${p.round_bet}</span>`; else displayStatus = `<span style="color:#887a70;">ЧЕК</span>`;
                    } else if (data.state === "DARK_BETTING" && p.is_dark_bettor) {
                        displayStatus = `<span style="color:#bcaaa4;">ТЕМНАЯ ${p.round_bet}</span>`;
                    } else if (data.state === "DARK_BETTING" && p.acted && !p.is_dark_bettor) {
                        displayStatus = `<span style="color:#e8dccc;">СВЕТЛАЯ</span>`;
                    } else if (p.status === "В игре") {
                        displayStatus = `<span style="color:#887a70;">ЖДЕТ ХОДА</span>`;
                    }
                }

                let dispScoreStr = isHero ? p.score_str : String(p.score_str).split(' (')[0];
                let scoreBadgeHtml = (isRevealPhase && !p.folded && p.score_num > 0 || (isRevealPhase && p.score_str === "СКРЫТО")) ? `<div class="p-score-badge">${dispScoreStr}</div>` : '';
                let handsLabel = p.extra_hands_count > 1 ? `<div class="extra-hands-badge">ДОП. РУК: ${p.extra_hands_count - 1}</div>` : '';
                let avatarLetter = p.name.charAt(0).toUpperCase();

                let clickHandler = (!isHero) ? `onclick="openPlayerMenu('${p.sid}', '${p.name}', ${p.balance})"` : `onclick="openHeroEmoteMenu()"`;
                let cursorStyle = 'cursor: pointer;';
                let dispBalance = window.currentBalances && window.currentBalances[p.sid] !== undefined ? Math.round(window.currentBalances[p.sid]) : p.balance;

                wrapper.innerHTML += `
                        <div class="${slotClass}">
                            <div class="player-plate" ${clickHandler} style="${cursorStyle}">
                                ${partnerIcon}
                                ${darkBadge}
                                ${cardsContainerHtml}
                                ${handsLabel}
                                <div class="avatar-wrap"><div class="avatar-letter">${avatarLetter}</div>${dealerBadge}<div class="timer-countdown"></div></div>
                                <div class="player-info-block">
                                    <div class="p-name">${p.name}</div>
                                    <div class="p-balance" data-sid="${p.sid}" data-target="${p.balance}">${dispBalance}</div>
                                    <div class="p-status">${displayStatus}</div>
                                </div>
                                ${scoreBadgeHtml}
                                <div class="timer-bar-container"><div class="timer-bar-fill"></div></div>
                            </div>
                        </div>
                    `;
            }
        });

        const heroZone = document.getElementById('hero-hand-center-zone');
        heroZone.innerHTML = '';
        heroZone.className = isRevealPhase ? 'hero-bottom-hand-zone show-score' : 'hero-bottom-hand-zone';
        if (me && winners.includes(me.sid)) {
            heroZone.classList.add('is-winner');
        }

        if (!isRevealPhase && me && me.cards && me.cards.length > 0 && !me.folded) {
            let heroCardsHtml = `<div class="hero-cards-wrapper">`;
            me.cards.slice(0, 3).forEach((card, idx) => {
                heroCardsHtml += buildCardHtml(card, false, true, false, isDealingPhase, me.score_num, idx, data.state);
            });
            heroCardsHtml += '</div>';

            let heroScoreHtml = '';
            if (data.state === "MAIN_BETTING" || data.state === "PRE_ROUND_WAIT" || isRevealPhase || data.state === "MUCK_OR_SHOW") {
                let initialScore = isRevealPhase ? me.score_str : calcSvaraScoreJS(me.cards.filter((c, i) => window.heroOpenedCards[i]));
                let txt = initialScore === 0 ? "ОЧКИ: 0" : `ОЧКИ: ${initialScore}`;
                heroScoreHtml = `<div class="hero-score-badge">${txt}</div>`;
            }
            heroZone.innerHTML = heroCardsHtml + heroScoreHtml;
        } else if (!isRevealPhase && me && (me.folded || me.status === 'В лобби') && me.partner_cards && me.partner_cards.length > 0) {
            let partnerCardsHtml = `<div class="hero-cards-wrapper sponsor-cards">`;
            me.partner_cards.slice(0, 3).forEach((card, idx) => {
                partnerCardsHtml += buildCardHtml(card, false, true, false, false, 0, -1, data.state);
            });
            partnerCardsHtml += '</div>';
            let heroScoreHtml = `<div class="hero-score-badge" style="font-size:10px;">КАРТЫ ПАРТНЁРА 🤝</div>`;
            heroZone.innerHTML = partnerCardsHtml + heroScoreHtml;
        }

        startTimerProgress(data.server_time, data.turn_deadline, data.turn_max_time, data.state, data.players);
    }

    socket.on('update_state', (data) => {
        if (!data || !data.players) return;
        const prevMe = previousGameState ? previousGameState.players.find(p => p.tg_id === userId) : null;
        const me = data.players.find(p => p.tg_id === userId);

        if (prevMe && prevMe.status !== 'В лобби' && me && me.status === 'В лобби') {
            showToast("Вы покинули стол. Возвращайтесь, как будете готовы!", "error");
        }

        previousGameState = window.latestData || null;

        if (data.state === "WAITING_PLAYERS" || data.state === "PRE_ROUND_WAIT") {
            hasDealtThisRound = false;
        }
        if (data.state !== "FINDING_DEALER") {
            document.querySelectorAll('.dealer-search-card').forEach(c => c.remove());
        }
        if (data.state !== "DEALING") {
            document.querySelectorAll('.animated-deal-card').forEach(c => c.remove());
        }

        let animatingPotChips = false;
        if (previousGameState) {
            data.players.forEach(p => {
                let prevP = previousGameState.players.find(old => old.sid === p.sid);
                if (prevP && !prevP.folded && p.folded && (previousGameState.state === "MAIN_BETTING" || previousGameState.state === "DARK_BETTING" || previousGameState.state === "EXTRA_HANDS")) {
                    animateFold(p.seat, p.tg_id === userId);
                }
            });

            let potDiff = data.pot - previousGameState.pot;
            if (potDiff > 0) {
                data.players.forEach(p => {
                    let prevP = previousGameState.players.find(old => old.sid === p.sid);
                    if (prevP && prevP.balance > p.balance) {
                        let amount = prevP.balance - p.balance;
                        let actionText = p.last_action || "";
                        animatePlayerBetToCenter(p.seat, amount, actionText);
                        animatingPotChips = true;
                    }
                });
            }

            if (data.state === "REVEAL" && previousGameState.state !== "REVEAL") {
                let winners = data.reveal_data?.winners || [];
                let isSvara = data.reveal_data?.is_svara || false;

                if (isSvara) {
                    setTimeout(() => {
                        playSound('svara_boom');
                        if (tg.HapticFeedback) {
                            tg.HapticFeedback.notificationOccurred('warning');
                            setTimeout(() => tg.HapticFeedback.impactOccurred('heavy'), 100);
                        }

                        document.body.style.animation = 'shake 0.8s';
                        setTimeout(() => document.body.style.animation = '', 800);

                        shootFireworks(window.innerWidth / 2, window.innerHeight / 2, 100, ['#8b1818', '#dcb360', '#111']);

                        let svaraText = document.createElement('div');
                        svaraText.innerText = "СВАРА";
                        svaraText.style.position = 'fixed';
                        svaraText.style.left = '50%';
                        svaraText.style.top = '40%';
                        svaraText.style.color = 'var(--blood-red)';
                        svaraText.style.fontFamily = '"Lora", serif';
                        svaraText.style.fontSize = '50px';
                        svaraText.style.fontWeight = '700';
                        svaraText.style.textShadow = '0 8px 30px rgba(0,0,0,1), 0 0 40px rgba(220, 179, 96, 0.8)';
                        svaraText.style.zIndex = '10000';
                        svaraText.style.transform = 'translate(-50%, -50%) scale(0.1)';
                        svaraText.style.pointerEvents = 'none';
                        document.body.appendChild(svaraText);

                        svaraText.animate([
                            {transform: 'translate(-50%, -50%) scale(0.1)', opacity: 0},
                            {transform: 'translate(-50%, -50%) scale(1.4)', opacity: 1, offset: 0.2},
                            {transform: 'translate(-50%, -50%) scale(1.2)', opacity: 1, offset: 0.8},
                            {transform: 'translate(-50%, -50%) scale(2.0)', opacity: 0}
                        ], {duration: 4000, easing: 'ease-out'});
                        setTimeout(() => svaraText.remove(), 4000);
                    }, 1000);
                } else if (winners.length > 0) {
                    setTimeout(() => {
                        let splitPartner = data.reveal_data?.split_with;
                        
                        // Логика полета фишек если банк разделен напарниками
                        if (splitPartner) {
                            let w = data.players.find(p => p.sid === winners[0]);
                            let sp = data.players.find(p => p.sid === splitPartner);
                            let half = data.pot / 2;
                            if (w) animatePotToWinner(w.seat, half);
                            if (sp) animatePotToWinner(sp.seat, half);
                        } else {
                            winners.forEach(wSid => {
                                let w = data.players.find(p => p.sid === wSid);
                                if (w) animatePotToWinner(w.seat, data.pot / winners.length);
                            });
                        }
                        
                        document.getElementById('center-pot-chips').innerHTML = '';
                        document.getElementById('center-pot-total-badge').style.display = 'none';
                        document.getElementById('center-pot-bet-badge').style.display = 'none';
                    }, 3500);
                }
            }
        }

        if (data.state === "DEALING") {
            if (!hasDealtThisRound) {
                hasDealtThisRound = true;
                if (!isAnimatingDeal) {
                    playDealingAnimation(data);
                    renderControls(data, me);
                }
            }
            window.latestData = JSON.parse(JSON.stringify(data));
            return;
        }

        if (data.state === "FINDING_DEALER") {
            renderPlayers(data, false);
            playDealerSearchAnimation(data);
            renderControls(data, me);
            window.latestData = JSON.parse(JSON.stringify(data));
            return;
        }

        isAnimatingDeal = false;

        if (data.state === "REVEAL") {
            document.getElementById('controls').className = '';
            document.getElementById('controls').innerHTML = '';
            if (previousGameState && previousGameState.state !== "REVEAL") {
                renderPlayers(data, false, true);
                playRevealLoop(data);
            } else {
                renderPlayers(data, false, false);
            }
        } else {
            renderPlayers(data, false);
            renderControls(data, me);
        }

        if (!animatingPotChips && !(data.state === "REVEAL" && data.reveal_data?.is_svara)) {
            document.getElementById('center-pot-chips').innerHTML = getChipHtml(data.pot);
        } else if (animatingPotChips) {
            setTimeout(() => {
                document.getElementById('center-pot-chips').innerHTML = getChipHtml(data.pot);
            }, 600);
        }

        window.latestData = JSON.parse(JSON.stringify(data));
    });

    function renderControls(data, me) {
        const ctrl = document.getElementById('controls');
        ctrl.innerHTML = '';
        ctrl.className = '';

        if (!me || (me.status === 'В лобби' && data.state !== "WAITING_PLAYERS" && data.state !== "PRE_ROUND_WAIT")) {
            ctrl.innerHTML = `<div class="controls-hint">НАБЛЮДЕНИЕ ЗА СТОЛОМ</div>`;
            return;
        }

        let hintHtml = `<div class="controls-hint" id="action-hint-text"></div>`;

        if (data.state === "WAITING_PLAYERS" || data.state === "PRE_ROUND_WAIT" || data.state === "ROUND_END") {
            if (me.status === 'В лобби' || !me.ready) {
                ctrl.innerHTML = hintHtml + `<button class="action-btn btn-gold" style="width:100%;" onclick="sendAction('set_ready')">ВОЙТИ В ИГРУ</button>`;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "ОЖИДАНИЕ ВАШЕГО ВХОДА";
                }, 50);
            } else {
                ctrl.innerHTML = `<div class="controls-hint">ПОДГОТОВКА СТОЛА... ⏳</div>`;
            }
            return;
        }

        if (data.state === "DEALING" || data.state === "FINDING_DEALER" || data.state === "VOTING_SUIT") return;

        let isMyTurn = (data.current_turn_sid === mySid);
        if (data.state === "PAYING_ANTE" && me && me.status === 'Ожидание анте' && !me.folded) {
            isMyTurn = true;
        }
        if (data.state === "SVARA_CHECK_IN" && me && me.status === 'Решает по Сваре' && !me.folded) {
            isMyTurn = true;
        }
        if (data.state === "EXTRA_HANDS" && me && me.status === 'Выбирает доп. руки' && !me.folded) {
            isMyTurn = true;
        }
        if (data.state === "WAITING_SVARA_ACCEPT" && me && me.sid !== data.svara_proposer_sid && !me.folded) {
            isMyTurn = true;
        }

        const isDealer = (data.dealer_sid === mySid);

        if (isMyTurn && data.turn_deadline > 0 && !window.turnAlertShown) {
            window.turnAlertShown = true;
            if (tg.HapticFeedback && tg.HapticFeedback.impactOccurred) {
                tg.HapticFeedback.impactOccurred('heavy');
                setTimeout(() => {
                    tg.HapticFeedback.impactOccurred('medium');
                }, 150);
            }
            playSound('turn');
        } else if (!isMyTurn) {
            window.turnAlertShown = false;
        }

        if (isMyTurn) {
            ctrl.classList.add('my-turn-active');
        }

        if (data.state === "MUCK_OR_SHOW") {
            if (isMyTurn) {
                ctrl.innerHTML = hintHtml + `
                        <div style="display:flex; gap:10px; width:100%;">
                            <button class="action-btn btn-glass" onclick="sendAction('show_cards')" style="flex:1;">ПОКАЗАТЬ</button>
                            <button class="action-btn btn-glass" onclick="sendAction('muck_cards')" style="flex:1;">СКРЫТЬ</button>
                        </div>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "УСПЕХ. ПОКАЗАТЬ КАРТЫ СИНДИКАТУ?";
                }, 50);
            }
            return;
        }

        if (data.state === "PAYING_ANTE") {
            if (me.status === 'Ожидание анте') {
                ctrl.innerHTML = hintHtml + `
                        <button class="action-btn btn-gold" onclick="sendAction('pay_ante')" style="flex:2;">ВКУПИТЬСЯ (${data.ante_stake})</button>
                        <button class="action-btn btn-danger" onclick="sendAction('fold')" style="flex:1;">ПАС</button>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = `ДОЛЯ ВХОДА: ${data.ante_stake}`;
                }, 50);
            }
            return;
        }

        if (data.state === "WAITING_SVARA_ACCEPT") {
            if (me.sid !== data.svara_proposer_sid && !me.folded) {
                ctrl.innerHTML = hintHtml + `
                        <div style="display:flex; gap:10px; width:100%;">
                            <button class="action-btn btn-gold" style="flex:1;" onclick="sendAction('accept_svara')">ИДТИ В СВАРУ</button>
                            <button class="action-btn btn-danger" style="flex:1;" onclick="sendAction('refuse_svara')">ВСКРЫТЬСЯ</button>
                        </div>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "ВЫЗОВ НА СВАРУ";
                }, 50);
            }
            return;
        }

        if (data.state === "CHOOSE_ANTE") {
            if (isDealer) {
                ctrl.innerHTML = hintHtml + `
                        <div style="display:flex; gap:10px; width:100%;">
                            <button class="action-btn btn-glass" style="flex:1;" onclick="sendAction('set_ante', 50)">50</button>
                            <button class="action-btn btn-glass" style="flex:1;" onclick="sendAction('set_ante', 100)">100</button>
                            <button class="action-btn btn-glass" style="flex:1;" onclick="sendAction('set_ante', 150)">150</button>
                        </div>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "ВЫБЕРИТЕ РАЗМЕР БАЗОВОЙ ДОЛИ";
                }, 50);
            }
            return;
        }

        if (data.state === "SVARA_CHECK_IN") {
            if (me.status === 'Решает по Сваре') {
                ctrl.innerHTML = hintHtml + `
                        <button class="action-btn btn-gold" onclick="sendAction('join_svara')" style="flex:2;">ИГРАТЬ (${data.svara_buyin_amount})</button>
                        <button class="action-btn btn-danger" onclick="sendAction('pass_svara')" style="flex:1;">ПАС</button>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = `ЦЕНА УЧАСТИЯ В СВАРЕ: ${data.svara_buyin_amount}`;
                }, 50);
            }
            return;
        }

        if (data.state === "CUT_DECK") {
            if (isMyTurn) {
                ctrl.innerHTML = hintHtml + `
                        <button class="action-btn btn-glass" onclick="broadcastCut(1)">СРЕЗАТЬ 50/50</button>
                        <button class="action-btn btn-glass" onclick="broadcastCut(2)">ВЕРХНЮЮ 1/3</button>
                        <button class="action-btn btn-glass" onclick="broadcastCut(3)">ПОСТУЧАТЬ</button>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "ВАШЕ ПРАВО СРЕЗАТЬ КОЛОДУ";
                }, 50);
            }
            return;
        }

        if (data.state === "DARK_BETTING") {
            if (isMyTurn) {
                ctrl.innerHTML = hintHtml + `
                        <div style="display:flex; gap:6px; justify-content:center; width:100%;">
                            <button class="action-btn btn-glass" onclick="sendAction('dark', 50)">ТЕМНАЯ 50</button>
                            <button class="action-btn btn-glass" onclick="sendAction('dark', 100)">ТЕМНАЯ 100</button>
                            <button class="action-btn btn-glass" onclick="sendAction('dark', 150)">ТЕМНАЯ 150</button>
                            <button class="action-btn btn-glass" onclick="sendAction('dark', 200)">ТЕМНАЯ 200</button>
                        </div>
                        <button class="action-btn btn-gold" onclick="sendAction('light')" style="width:100%; margin-top:10px;">В СВЕТЛУЮ</button>
                    `;
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = "ТЕНЕВОЙ РАУНД";
                }, 50);
            }
            return;
        }

        if (data.state === "EXTRA_HANDS") {
            if (me.status === 'Выбирает доп. руки') {
                let maxAffordable = Math.floor(me.balance / data.ante_stake);
                let maxGlobal = Math.floor(data.deck_count / 3);
                let available = Math.min(maxAffordable, maxGlobal, 3);

                let btns = `<button class="action-btn btn-glass" onclick="sendAction('extra_hands', 0)">БЕЗ ДОКУПОК</button>`;
                if (available >= 1) btns += `<button class="action-btn btn-gold" onclick="sendAction('extra_hands', 1)">+1 (${data.ante_stake})</button>`;
                if (available >= 2) btns += `<button class="action-btn btn-gold" onclick="sendAction('extra_hands', 2)">+2 (${data.ante_stake * 2})</button>`;
                if (available >= 3) btns += `<button class="action-btn btn-gold" onclick="sendAction('extra_hands', 3)">+3 (${data.ante_stake * 3})</button>`;

                ctrl.innerHTML = hintHtml + `<div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:100%;">${btns}</div>`;
                let maxText = maxGlobal === 0 ? "В КОЛОДЕ НЕТ КАРТ!" : "ПОКУПКА ДОПОЛНИТЕЛЬНЫХ РУК";
                setTimeout(() => {
                    document.getElementById('action-hint-text').innerText = maxText;
                }, 50);
            }
            return;
        }

        if (data.state === "MAIN_BETTING") {
            if (isMyTurn) {
                let toCall = data.current_bet - (me.round_bet || 0);
                let isOpening = data.current_bet === 0;

                let maxRaiseLimit;
                if (isOpening) {
                    maxRaiseLimit = 400;
                } else {
                    maxRaiseLimit = data.current_bet * 2;
                }

                let actualMaxRaise = Math.min(me.balance, maxRaiseLimit);
                let currentRaises = data.raise_count || 0;

                let minRaise = isOpening ? 50 : data.current_bet + 50;

                let canRaise = true;
                if (actualMaxRaise < minRaise) canRaise = false;
                if (data.dark_raised && me.is_dark_bettor && toCall <= 0) canRaise = false;
                if (!isOpening && currentRaises >= 3) canRaise = false;
                if (!isOpening && data.current_bet >= 1600) canRaise = false;

                let activePlayersCount = data.players.filter(p => !p.folded && p.status !== 'В лобби').length;

                let callBtnHtml = '';
                if (toCall > 0) {
                    if (me.balance >= toCall) callBtnHtml = `<button class="action-btn btn-gold" onclick="sendAction('call')" style="flex:1;">УРАВНЯТЬ (${toCall})</button>`;
                    else callBtnHtml = `<button class="action-btn btn-danger" onclick="sendAction('all_in')" style="flex:1;">ВА-БАНК (${me.balance})</button>`;
                } else if (data.current_bet > 0) {
                    callBtnHtml = `<button class="action-btn btn-glass" onclick="sendAction('reveal')" style="flex:1;">ВСКРЫТЬСЯ</button>`;
                }

                let foldBtnHtml = `<button class="action-btn btn-danger" onclick="sendAction('fold')" style="flex:1;">ПАС</button>`;
                if (me.extra_hands_count > 1) {
                    let currentHandIndex = (me.original_hands_count || 1) - me.extra_hands_count + 2;
                    let handNames = {2: "2-Я", 3: "3-Я", 4: "4-Я"};
                    let hName = handNames[currentHandIndex] || "СЛЕД.";
                    foldBtnHtml = `<button class="action-btn btn-glass" onclick="sendAction('fold')" style="flex:1;">${hName} РУКА</button>`;
                }

                let raiseHtml = '';
                if (canRaise) {
                    let raiseBtnText = isOpening ? 'СТАВКА' : 'ПОВЫСИТЬ';
                    raiseHtml = `
                            <div class="raise-input-group" style="width:100%; justify-content:center; margin-top:10px;">
                                <button class="action-btn btn-glass" style="padding: 10px 12px;" onclick="adjRaise(-50, ${minRaise}, ${actualMaxRaise})">➖</button>
                                <input type="number" id="raise-val" value="${minRaise}" step="50" min="${minRaise}" max="${actualMaxRaise}" readonly>
                                <button class="action-btn btn-glass" style="padding: 10px 12px;" onclick="adjRaise(50, ${minRaise}, ${actualMaxRaise})">➕</button>
                                <button class="action-btn btn-gold" style="padding: 10px 18px; margin-left: 6px;" onclick="sendAction('raise', document.getElementById('raise-val').value)">${raiseBtnText}</button>
                            </div>
                        `;
                }

                let svaraBtnHtml = '';
                if (activePlayersCount === 2 && toCall === 0 && data.current_bet > 0) {
                    svaraBtnHtml = `<button class="action-btn btn-glass" style="width: 100%; margin-top: 10px;" onclick="sendAction('propose_svara')">ВЫЗОВ НА СВАРУ</button>`;
                }

                ctrl.innerHTML = hintHtml + `
                        <div style="display:flex; gap:10px; justify-content:center; width:100%;">
                            ${foldBtnHtml}
                            ${callBtnHtml}
                        </div>
                        ${raiseHtml}
                        ${svaraBtnHtml}
                    `;

                setTimeout(() => {
                    let txt = '';
                    if (isOpening) {
                        txt = "ДЕЛАЙТЕ СТАВКУ, БОСС";
                    } else if (toCall > 0) {
                        txt = `ОТВЕТЬТЕ НА ВЫЗОВ: ${toCall}`;
                    } else {
                        txt = "ВСКРЫТИЕ ИЛИ ПОВЫШЕНИЕ";
                    }
                    if (!canRaise && toCall > 0 && !isOpening) txt = `ЛИМИТ ПОВЫШЕНИЙ ИСЧЕРПАН. СТАВКА: ${toCall}`;
                    document.getElementById('action-hint-text').innerText = txt;
                }, 50);
            } else {
                ctrl.innerHTML = `<div class="controls-hint">ХОД КОНКУРЕНТА...</div>`;
            }
            return;
        }
    }

    socket.on('error', (err) => {
        showToast(err.message, "error");
    });

    socket.on('game_log', (msg) => {
        addLog(msg.text);

        const lowerMsg = msg.text.toLowerCase();
        if (lowerMsg.includes('закружил') || lowerMsg.includes('закружить') || lowerMsg.includes('кикнут')) {
            showToast(msg.text, 'info');
        }
    });
</script>
</body>
</html>
